name: bhavcopy
version: "1.0"
profile: bhavcopy
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

models:
  bhavcopy:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  # A day's row count may drift this far from the exchange's trailing median
  # before the volume test fails.
  row_count_tolerance: 0.2
  # Mainboard names with at least this turnover (in rupees) count as liquid.
  liquid_turnover: 10000000
